
name: Build NAVNEET VENDOR MANAGER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip NAVNEET_VENDOR_MANAGER_Android_Project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew -type f | head -1)
          cd "$(dirname "$(find project -name gradlew -type f | head -1)")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVNEET-VENDOR-MANAGER-APK
          path: project/**/build/outputs/apk/**/*.apk
